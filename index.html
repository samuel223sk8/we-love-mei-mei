<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1" name="viewport"/><title>We Love Mei Mei</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
:root{--purple:#bd82ed;--deep:#67279d;--ink:#38104f;--white:#fffafc}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--purple);color:var(--white);font-family:Nunito,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 10%,#ffffff20,transparent 34%),radial-gradient(circle at 85% 50%,#8e45c630,transparent 35%)}a{color:inherit;text-decoration:none}.wrap{max-width:1150px;margin:auto;padding:0 24px}header{padding:23px 0}.nav{border:2px solid #fff;border-radius:60px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;background:#7e36b533;box-shadow:0 12px 30px #67279d22}.logo{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.35rem}.links{display:flex;gap:25px;font-weight:800}.links a:hover{text-decoration:underline}.hero{text-align:center;padding:58px 0 35px}.crown{font-size:3rem;display:block;transform:rotate(-8deg)}h1{font-family:Fredoka,system-ui,sans-serif;font-size:clamp(3rem,9vw,7.5rem);line-height:1.05;margin:10px 0 18px;letter-spacing:1px;text-shadow:5px 6px 0 #8134b4}.hero p{font-size:clamp(1rem,2.1vw,1.32rem);font-weight:800;max-width:800px;margin:8px auto;line-height:1.6}.sparkle{font-size:1.5rem}.section-heading{text-align:center;font-family:Fredoka,sans-serif;font-size:2.3rem;margin:30px 0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding-bottom:55px}.photo-card{background:#ffffffec;color:var(--ink);border:4px solid white;border-radius:30px;overflow:hidden;box-shadow:0 12px 0 #8c48bd55,0 18px 35px #64218b30;transition:transform .2s}.photo-card:hover{transform:translateY(-7px) rotate(-.6deg)}.photo-button{display:block;border:0;background:transparent;padding:0;width:100%;cursor:zoom-in}.photo-button img{display:block;width:100%;height:310px;object-fit:cover}.card-info{text-align:center;padding:14px 13px 20px}.card-info h3{font:600 1.5rem Fredoka,sans-serif;color:#8c32bd;margin:0 0 8px}.card-info p{margin:0;font-weight:700;font-size:.96rem}.about{text-align:center;background:#ffffff2b;border:2px solid #ffffff80;border-radius:32px;padding:28px;margin-bottom:40px}.about h2{font:600 2rem Fredoka,sans-serif;margin:0 0 12px}.about p{font-size:1.1rem;font-weight:700;max-width:670px;margin:0 auto 20px}.love{border:2px solid white;background:#8034b4;color:white;border-radius:50px;padding:14px 28px;font:600 1.2rem Fredoka,sans-serif;cursor:pointer;transition:transform .2s}.love:hover{transform:scale(1.05)}#counter{margin-top:12px;font-weight:800}footer{text-align:center;padding:0 0 28px;font-weight:800}.lightbox{position:fixed;inset:0;background:#1b0b29e8;z-index:10;display:none;align-items:center;justify-content:center;padding:30px}.lightbox.open{display:flex}.lightbox img{max-height:82vh;max-width:90vw;object-fit:contain;border-radius:20px;border:5px solid white}.close{position:absolute;right:22px;top:15px;border:0;background:#fff;color:#6d2d98;border-radius:50%;font-size:30px;width:48px;height:48px;cursor:pointer}@media(max-width:800px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.photo-button img{height:250px}.hero{padding-top:30px}.links{gap:12px}}@media(max-width:520px){.gallery{grid-template-columns:1fr}.photo-button img{height:360px}.logo{font-size:1.05rem}.links{font-size:.83rem}.nav{padding:12px 15px}.wrap{padding:0 15px}.hero p{font-size:1rem}.card-info h3{font-size:1.45rem}}

.card-info{padding:14px 13px 17px}.card-info h3{margin:0}.hero{padding:45px 0 30px}.hero p{font-family:Fredoka,sans-serif;font-size:1.65rem}.about{display:none;min-height:45vh;margin-top:55px;padding:70px 25px}.about p{margin:0 auto}.about h2{font-size:3rem}.about.visible{display:block}body.about-page .hero,body.about-page .gallery{display:none}body.about-page .about{display:block}.links a.active{background:white;color:#7e36b5;border-radius:30px;padding:4px 15px}.links{align-items:center}
</style></head><body><div class="wrap"><header id="home"><nav class="nav"><a class="logo" href="#home">We Love Mei Mei</a><div class="links"><a href="#home">Home</a><a href="#gallery">Gallery</a><a href="#about">About</a></div></nav></header><section class="hero"><h1>WE LOVE MEI MEI</h1><p>Pictures of Mei Mei</p></section><main class="gallery"><article class="photo-card"><button aria-label="View Scared Mei Mei" class="photo-button" onclick="openPhoto(0)" type="button"><img alt="Scared Mei Mei" loading="lazy" src="images/scared.jpg"/></button><div class="card-info"><h3>Scared Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Locked In Mei Mei" class="photo-button" onclick="openPhoto(1)" type="button"><img alt="Locked In Mei Mei" loading="lazy" src="images/locked-in.jpg"/></button><div class="card-info"><h3>Locked In Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Teletubbies Mei Mei" class="photo-button" onclick="openPhoto(2)" type="button"><img alt="Teletubbies Mei Mei" loading="lazy" src="images/teletubbies.jpg"/></button><div class="card-info"><h3>Teletubbies Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Owl Mei Mei" class="photo-button" onclick="openPhoto(3)" type="button"><img alt="Owl Mei Mei" loading="lazy" src="images/owl.jpg"/></button><div class="card-info"><h3>Owl Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Bee Mei Mei" class="photo-button" onclick="openPhoto(4)" type="button"><img alt="Bee Mei Mei" loading="lazy" src="images/bee.jpg"/></button><div class="card-info"><h3>Bee Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Pepper Mei Mei" class="photo-button" onclick="openPhoto(5)" type="button"><img alt="Pepper Mei Mei" loading="lazy" src="images/pepper.jpg"/></button><div class="card-info"><h3>Pepper Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Happy Mei Mei" class="photo-button" onclick="openPhoto(6)" type="button"><img alt="Happy Mei Mei" loading="lazy" src="images/happy.jpg"/></button><div class="card-info"><h3>Happy Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Judging Mei Mei" class="photo-button" onclick="openPhoto(7)" type="button"><img alt="Judging Mei Mei" loading="lazy" src="images/judging.jpg"/></button><div class="card-info"><h3>Judging Mei Mei</h3></div></article>
<article class="photo-card"><button aria-label="View Cute Mei Mei" class="photo-button" onclick="openPhoto(8)" type="button"><img alt="Cute Mei Mei" loading="lazy" src="images/cute.jpg"/></button><div class="card-info"><h3>Cute Mei Mei</h3></div></article></main><section class="about" id="about"><h2>About</h2><p>All the pictures of Mei Mei I have.</p></section></div><div aria-label="Enlarged Mei Mei photo" class="lightbox" id="lightbox" onclick="closePhoto(event)" role="dialog"><button aria-label="Close photo" class="close" onclick="closePhoto()" type="button">×</button><img alt="Mei Mei" id="bigPhoto"/></div><script>
const photos=['scared','locked-in','teletubbies','owl','bee','pepper','happy','judging','cute'];const titles=['Scared Mei Mei','Locked In Mei Mei','Teletubbies Mei Mei','Owl Mei Mei','Bee Mei Mei','Pepper Mei Mei','Happy Mei Mei','Judging Mei Mei','Cute Mei Mei'];function openPhoto(i){document.getElementById('bigPhoto').src='images/'+photos[i]+'.jpg';document.getElementById('bigPhoto').alt=titles[i];document.getElementById('lightbox').classList.add('open')}function closePhoto(e){if(!e||e.target.id==='lightbox'||e.target.className==='close')document.getElementById('lightbox').classList.remove('open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhoto()});
function updateView(){const isAbout=location.hash==='#about';document.body.classList.toggle('about-page',isAbout);document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===(isAbout?'#about':location.hash==='#gallery'?'#gallery':'#home')));if(isAbout)window.scrollTo(0,0)}window.addEventListener('hashchange',updateView);updateView();
</script></body></html>
